<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RIFTWAKE</title>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#05070d;color:white;font:14px system-ui}body{display:grid;place-items:center}canvas{width:min(96vw,1200px);aspect-ratio:16/9;border:1px solid #35416b;border-radius:18px;box-shadow:0 25px 90px #000}#top,#help{position:fixed;left:50%;transform:translateX(-50%);width:min(92vw,1100px);display:flex;justify-content:space-between;pointer-events:none}#top{top:16px}#help{bottom:14px;justify-content:center;color:#9aa6c8}.badge{background:#0b1020dd;border:1px solid #35416b;border-radius:999px;padding:8px 13px}</style></head>
<body><canvas id="c" width="1200" height="675"></canvas><div id="top"><span class="badge">RIFTWAKE // ECHO PROTOCOL</span><span class="badge" id="status">LIVE</span></div><div id="help">WASD / Arrow Keys · SPACE record/release Echo · R restart · ENTER next fracture</div>
<script>
const c=document.getElementById('c'),g=c.getContext('2d'),W=1200,H=675,k={};addEventListener('keydown',e=>{k[e.key.toLowerCase()]=1;if(e.code==='Space'){e.preventDefault();echoToggle()}if(e.key.toLowerCase()==='r')reset();if(e.key==='Enter'&&won&&level<1){level++;reset()}});addEventListener('keyup',e=>k[e.key.toLowerCase()]=0);
const levels=[
{start:[85,585],exit:[1080,90],walls:[[0,0,1200,24],[0,651,1200,24],[0,0,24,675],[1176,0,24,675],[170,90,760,22],[170,90,22,260],[430,90,22,160],[650,90,22,260],[910,90,22,160],[170,350,300,22],[520,350,370,22],[990,230,22,260],[270,500,640,22]],door:[940,90,35,22]},
{start:[80,80],exit:[1090,585],walls:[[0,0,1200,24],[0,651,1200,24],[0,0,24,675],[1176,0,24,675],[120,140,22,430],[120,140,300,22],[420,140,22,260],[420,400,310,22],[730,110,22,310],[730,110,300,22],[1030,110,22,460],[250,550,780,22]],door:[1030,470,22,80]}];
let level=0,L,p,e,recording,frames,won,particles;
function reset(){L=levels[level];p={x:L.start[0],y:L.start[1],r:13};e=[];recording=true;frames=[];won=false;particles=[]}
function echoToggle(){if(won)return;if(recording&&frames.length>5){e.push({f:frames.slice(),i:0,x:frames[0].x,y:frames[0].y});frames=[];recording=false}else if(!recording){recording=true;frames=[]}}
function blocked(px,py,r){for(const q of L.walls){let X=Math.max(q[0],Math.min(px,q[0]+q[2])),Y=Math.max(q[1],Math.min(py,q[1]+q[3]));if((px-X)**2+(py-Y)**2<r*r)return true}let d=L.door;if(d&&!doorOpen()){let X=Math.max(d[0],Math.min(px,d[0]+d[2])),Y=Math.max(d[1],Math.min(py,d[1]+d[3]));if((px-X)**2+(py-Y)**2<r*r)return true}return false}
function doorOpen(){return e.length>0&&e.some(z=>z.x>500)}
function move(dx,dy){if(!blocked(p.x+dx,p.y,p.r))p.x+=dx;if(!blocked(p.x,p.y+dy,p.r))p.y+=dy}
function update(){if(won)return;let dx=(k.d||k.arrowright?1:0)-(k.a||k.arrowleft?1:0),dy=(k.s||k.arrowdown?1:0)-(k.w||k.arrowup?1:0),n=Math.hypot(dx,dy)||1;move(dx/n*3.1,dy/n*3.1);if(recording)frames.push({x:p.x,y:p.y});for(const z of e){let f=z.f[Math.min(z.i++,z.f.length-1)];z.x=f.x;z.y=f.y}if(Math.hypot(p.x-L.exit[0],p.y-L.exit[1])<34){won=true;for(let i=0;i<80;i++)particles.push({x:p.x,y:p.y,vx:(Math.random()-.5)*8,vy:(Math.random()-.5)*8,a:1})}}
function draw(){g.fillStyle='#080b16';g.fillRect(0,0,W,H);g.strokeStyle='#111a35';for(let X=24;X<W;X+=40){g.beginPath();g.moveTo(X,24);g.lineTo(X,651);g.stroke()}for(let Y=24;Y<H-24;Y+=40){g.beginPath();g.moveTo(24,Y);g.lineTo(1176,Y);g.stroke()}g.fillStyle='#3de2b1';g.shadowBlur=25;g.shadowColor='#3de2b1';g.beginPath();g.arc(...L.exit,25,0,7);g.fill();g.shadowBlur=0;g.fillStyle='#26345f';for(const q of L.walls)g.fillRect(...q);if(L.door){g.fillStyle=doorOpen()?'#3de2b1':'#b94c74';g.fillRect(...L.door)}for(const z of e){g.fillStyle='#a66cff55';g.strokeStyle='#a66cff';g.beginPath();g.arc(z.x,z.y,17,0,7);g.fill();g.stroke()}g.fillStyle='#fff';g.shadowBlur=22;g.shadowColor='#fff';g.beginPath();g.arc(p.x,p.y,p.r,0,7);g.fill();g.shadowBlur=0;document.getElementById('status').textContent=recording?'RECORDING':'LIVE';if(won){for(const q of particles){q.x+=q.vx;q.y+=q.vy;q.a-=.02;g.globalAlpha=Math.max(0,q.a);g.fillStyle='#3de2b1';g.fillRect(q.x,q.y,4,4)}g.globalAlpha=1;g.fillStyle='#050812dd';g.fillRect(0,0,W,H);g.fillStyle='#fff';g.textAlign='center';g.font='700 46px system-ui';g.fillText('FRACTURE STABILIZED',W/2,300);g.font='18px system-ui';g.fillText(level===0?'Press ENTER for the next fracture':'Prototype complete — press R to replay',W/2,345);g.textAlign='left'}}
reset();(function loop(){update();draw();requestAnimationFrame(loop)})();</script></body></html>
